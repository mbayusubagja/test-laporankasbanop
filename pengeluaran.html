<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f5f5f5">

<title>Pengeluaran</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/button.css">

</head>

<body>

<div class="container">

  <div class="header">
    <h2>Tambah Pengeluaran</h2>
  </div>

  <div class="card">

    <label for="tanggal">Tanggal</label>
    <input type="datetime-local" id="tanggal">

    <label for="kategori">Kategori</label>
    <select id="kategori">
      <option value="">Pilih Kategori</option>
      <option value="Transportasi">Transportasi</option>
      <option value="Project">Project</option>
      <option value="Konsumsi">Konsumsi</option>
      <option value="Lainnya">Lainnya</option>
    </select>

    <label for="nominal">Nominal</label>

    <input
      type="text"
      id="nominal"
      inputmode="numeric"
      placeholder="Rp 0"
    >

    <label for="catatan">Keterangan</label>

    <textarea
      id="catatan"
      placeholder="Catatan"
    ></textarea>

    <label for="file">Upload Bukti</label>

    <input type="file" id="file" accept="image/*,.pdf">
    <img id="preview">

    <p id="status"></p>

    <button
      id="btnSimpan"
      class="primaryBtn"
      onclick="simpanPengeluaran()"
    >
      Simpan
    </button>

    <button
      class="btnBack"
    >
      Kembali
    </button>

  </div>

</div>

<div id="loadingProses"
     class="loadingProses hidden">

    <div class="loadingBox">

        <div class="spinner"></div>

        <h3 id="loadingTitle">
            Memproses file...
        </h3>

        <p id="loadingText">
            Sedang menyiapkan...
        </p>

        <div class="progressWrapper">

            <div class="progressTrack">

                <div
                    id="loadingProgressBar"
                    class="progressBar">
                </div>

            </div>

            <div
                id="loadingPercent"
                class="loadingPercent">
                0%
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>

<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/supabase.js"></script>

<script src="js/pengeluaran.js"></script>

</body>
</html>
