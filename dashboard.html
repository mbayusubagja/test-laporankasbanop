<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f5f5f5">

<title>Dashboard</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/navigasi.css">

<style>

</style>

</head>

<body>

<div class="container">

  <div class="header">

      <div class="headerTop">

        <div class="appTitle">

          <img
            src="./logo.png"
            alt="Logo"
            class="logoDashboard"
          >

          <div class="appText">
            <div>Laporan Keuangan</div>
            <div>Operasional</div>
          </div>

        </div>

        <div class="keepLoginBox">

          <div class="switchRow">
            <span>Always<br>Login</span>

            <label class="switch">
              <input type="checkbox" id="rememberLogin">
              <span class="slider"></span>
            </label>
          </div>

        </div>

      </div>

      <p>
        Login :
        <strong id="userInfo"></strong>
      </p>

      <div id="ringkasanBulan" class="ringkasanBulan">
        <div class="itemRingkasan">
          <span>Pemasukan:</span><br>
          <strong id="totalMasukBulan">Rp ...</strong>
        </div>

        <div class="itemRingkasan">
        <span>Pengeluaran:</span><br>
        <strong id="totalKeluarBulan">Rp ...</strong>
        </div>
      </div>

      <div class="itemRingkasan" style="margin-top:16px;">

          <div style="margin:0; padding:0; color:white; font-size:12px;">Total Saldo :</div>

            <div id="saldo" class="saldo">
              Rp ...
            </div>

      </div>

  </div>

  

  <div class="card">

      <p style="margin:0; padding:0; color:#777; font-size:12px;">Transaksi Terbaru :</p>

      <div id="listTransaksi">

        <div class="kosong">
        Loading...
        </div>

      </div>

  </div>

  <div class="menu">
    <div class="card">
        <p style="margin:0; padding:0; color:#777; font-size:12px;">Menu :</p>

          <button onclick="tambahPemasukan()">Pemasukan</button>
          <button onclick="tambahPengeluaran()" id="btnPengeluaran">Pengeluaran</button>

    </div>
  </div>

</div>

<div class="bottomNav">

  <button data-menu="dashboard" onclick="lihatDashboard()">
    <span>🏠</span>
    <small>Home</small>
  </button>

  <button data-menu="laporan" onclick="lihatRiwayatTransaksi()">
    <span>📊</span>
    <small>Laporan</small>
  </button>

  <button data-menu="user-profil" onclick="lihatProfil()">
    <span>👤</span>
    <small>Profil</small>
  </button>

  <button data-menu="dompet" onclick="logout()">
    <span>↪️</span>
    <small>Logout</small>
  </button>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/supabase.js"></script>

<script src="js/dashboard.js"></script>
<script src="js/nav.js"></script>



</body>
</html>
